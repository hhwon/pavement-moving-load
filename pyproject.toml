[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movingload"
version = "1.1.0"
description = "Moving wheel load on a layered linear (elastic or viscoelastic) pavement: Abaqus deck generation, cluster submission and post-processing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["abaqus", "pavement", "finite-element", "moving-load", "fatigue"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
]

# numpy is needed for the mesh; matplotlib only for the figures.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[project.scripts]
movingload = "movingload.submit:main"

[tool.setuptools]
packages = ["movingload"]
